name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the library's one dependency
        run: npm ci --prefix lib/person-managed-auth
      - name: Syntax
        run: |
          node --check compose/source/server.mjs
          node --check examples/run-loop.mjs
          node --check scripts/sync-upstream.mjs
          for f in lib/person-managed-auth/src/*.js examples/person-managed-auth/*.mjs examples/person-managed-auth/page/*.mjs examples/person-managed-auth/page/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test
