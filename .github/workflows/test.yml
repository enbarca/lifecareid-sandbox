name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check compose/source/server.mjs && node --check examples/run-loop.mjs && node --check scripts/sync-upstream.mjs
      - name: Tests
        run: node --test
